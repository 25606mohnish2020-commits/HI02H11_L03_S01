:root{ --mascot-left:16.5px; --mascot-top:18px; --mascot-size:132px;
  --bg:#F2F7FA;   /* THE ONE page/stage background — off-white (whisper-warm so white cards stay visible). Change it HERE and it changes everywhere; no theme may override the stage background. Pure white = #FFFFFF. */
  --navy:#0B3D8C; --navy-dk:#072A6A;
  --band-bg:#CBE8FF; --band-edge:#FFFFFF;                  /* r4/F6 DS: pill is #CBE8FF with a WHITE border */
  --cream:#FFF6D8; --cream-edge:#F0E5C8;
  --pic-bg:#F4F8FE; --pic-border:#7DA8DA;
  /* FLN Assets Kit design tokens */
  --selected:#386AF6; --selected-bg:#E6F0FF;
  --correct:#00B132; --correct-bg:#CCF8D8;
  --wrong:#F93544; --wrong-bg:#FFEBEC;
  --drag-bg:#D9ECFF; --drag-border:#8BBFFF;
  --font-hi:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;
  --band-top:46px; --band-left:76.5px; --band-w:1214.59px; --band-h:84px;   /* r4/F6 DS header spec */
  /* pad-l only has to clear the avatar + its speaker chip, which end at x=166 in stage
     coords (chip-left 100 + chip-size 66); the band itself starts at 76.5 + 3px border.
     At 150px the text began at 229.5 — 63.5px of dead space past the chip, which read as
     the prompt floating away from the Swiftie. 110px starts it at 189.5, keeping ~23px
     clear of the chip. Left-aligned text, so this shifts every prompt in the deck; it
     also gives long prompts more room before they wrap. */
  --band-pad-l:110px; --band-pad-r:150px; --band-radius:999px; --band-border:3px;
  --band-font:32px;   /* r4/F6 DS: 132px circular avatar on the pill's left end */
  --chip-size:66px; --chip-left:100px; --chip-top:84px;        /* r4/F6 DS: 70px chip at the avatar's bottom-right SHOULDER (pill right stays clean) */
  --hint-top:55px; --hint-right:50px; --hint-size:66px;   /* hint sits just left of the volume chip */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
/* r4/F8 chrome guards: no rubber-band overscroll, no native image-drag ghost (drag mechanics use pointer events) */
html,body{height:100%;background:var(--bg);font-family:var(--font-hi);color:var(--navy);user-select:none;-webkit-user-select:none;-moz-user-select:none;touch-action:manipulation;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;}
img,svg{-webkit-user-drag:none;user-drag:none;outline:0;border:0;background:transparent;}
/* in-lesson: off-white letterbox matches the off-white stage; start screen: blue to match the starburst */
body.is-start{background:#47BCFD;}   /* [20a landing] new-blue ground */
.stage-wrap{width:calc(1333px*var(--scale,1));height:calc(750px*var(--scale,1));position:relative;}
.stage{width:1333px;height:750px;position:absolute;top:0;left:0;transform-origin:top left;transform:scale(var(--scale,1));background:var(--bg);overflow:hidden;display:flex;flex-direction:column;}
.stage-inner{flex:1;min-height:0;display:flex;flex-direction:column;transition:filter .25s ease;}
.stage.blurred .stage-inner{filter:blur(5px);}

/* ===== HEADER (constant chrome) ===== */
.header-row{position:relative;flex-shrink:0;height:150px;}   /* r4/F6 DS header band */
.prompt-band{position:absolute;top:var(--band-top);left:var(--band-left);width:var(--band-w);height:var(--band-h);background:var(--band-bg);border:var(--band-border) solid var(--band-edge);border-radius:var(--band-radius);display:flex;align-items:center;justify-content:flex-start;padding:0 var(--band-pad-r) 0 var(--band-pad-l);z-index:1;box-shadow:0 3px 0 rgba(11,61,140,.05);}
.prompt-band .prompt-text{font-weight:600;font-size:var(--band-font);color:#012F76;letter-spacing:.2px;line-height:1;text-align:left;}
/* volume/audio chip — RIGHT side of the header (the dynamic Swiftie now owns the left) */
.audio-chip{position:absolute;top:var(--chip-top);left:var(--chip-left);width:var(--chip-size);height:var(--chip-size);z-index:41;cursor:pointer;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));transition:transform .12s;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;padding:0;}
.audio-chip img{width:100%;height:100%;object-fit:contain;}
.audio-chip:hover{transform:scale(1.06);}
.audio-chip:active{transform:scale(.95);}
.audio-chip.vo-disabled,.tut-audio.vo-disabled,.sg-vo:disabled,.read-whole-btn:disabled{opacity:.58;cursor:not-allowed;pointer-events:none;}
.hint-btn{position:absolute;top:var(--hint-top);right:var(--hint-right);width:var(--hint-size);height:var(--hint-size);background:linear-gradient(90deg,#1987FC,#1565F4);border:4px solid #FFFFFF;border-radius:50%;box-shadow:0 4px 4px rgba(0,0,0,.25);cursor:pointer;z-index:5;visibility:hidden;opacity:0;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,opacity .25s;}
.hint-btn svg{width:auto;height:58%;overflow:visible;display:block;}
.hint-btn.show{visibility:visible;opacity:1;animation:hintPop .35s cubic-bezier(.34,1.5,.6,1);}
@keyframes hintPop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.hint-btn:active{transform:scale(.96);}
.hint-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== SLIDE STAGE (changes per slide) =====
   Activity area keeps a 150px gap on left & right (matches Q-format reference)
   so content sits centred with breathing room, never edge-to-edge. */
.slide-stage{flex:1;min-height:0;overflow:hidden;position:relative;padding:6px 150px 100px;display:flex;align-items:stretch;justify-content:center;}
.slide-host{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;}
.intro-letter{width:184px;height:184px;border-radius:24px;background:#fff;border:2px solid #EEF3FA;display:flex;align-items:center;justify-content:center;font-size:104px;line-height:1;font-weight:800;color:var(--navy);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;box-shadow:0 10px 26px rgba(11,61,140,.14),0 2px 6px rgba(11,61,140,.06);}
.intro-letter:hover{transform:translateY(-4px);box-shadow:0 9px 18px rgba(11,61,140,.18);}
/* tapped (heard) → turns green */
.intro-letter.played{background:var(--correct-bg);border-color:var(--correct);color:#0a7a2e;}
.meet-letter-box{min-width:300px;max-width:420px;height:340px;padding:0 24px;border-radius:28px;background:var(--cream);border:4px solid #F0D98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px rgba(11,61,140,.12);cursor:pointer;}
.meet-letter-box .glyph{font-size:200px;font-weight:800;color:var(--navy);line-height:1.05;white-space:nowrap;max-width:100%;}
/* IN-WORD matra colouring (right-spacing matras like ा): full word in navy + a red copy of the
   same word clipped to just the matra column(s). Both layers = identical string/coords → the red
   lands exactly on the matra strokes, no dotted circle, no duplicate आ. */
.meet-letter-box .matra-word{display:block;max-width:100%;max-height:320px;height:auto;color:var(--navy);}
.matra-word .mw-base{fill:currentColor;}
.matra-word .mw-red text{fill:var(--matra-red,#E5533C);}
.meet-letter-box .label{font-size:30px;font-weight:700;color:var(--navy-dk);}
.stimulus-letter{width:200px;height:200px;border-radius:24px;background:var(--cream);border:4px solid var(--cream-edge);display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:800;color:var(--navy);box-shadow:0 6px 0 var(--cream-edge);}
.stimulus-letter img{width:140px;height:140px;object-fit:contain;}
.stimulus-pic{width:240px;height:200px;border-radius:24px;background:var(--pic-bg);border:4px solid var(--pic-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.stimulus-pic .img{width:140px;height:140px;object-fit:contain;}
.stimulus-pic .img.fallback{display:none;}
.stimulus-pic .emoji{font-size:110px;line-height:1;}
.stimulus-pic .lbl{font-size:24px;font-weight:700;color:var(--navy);}

/* cards are compact + centred (not stretched to full height/width) */
.opt-grid{display:grid;gap:20px;flex:1;min-height:0;width:100%;max-width:1100px;align-items:center;align-content:center;justify-content:center;}
/* every option box is a white tile with a SOFT (blurred) shadow-border, no hard outline — Figma look */
.opt-cell{background:#fff;border:3px solid #EEF3FA;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;padding:12px;min-height:210px;box-shadow:0 12px 28px rgba(11,61,140,.14),0 2px 6px rgba(11,61,140,.06);}
.opt-cell:hover{transform:translateY(-3px);border-color:var(--selected);box-shadow:0 8px 20px rgba(56,106,246,.18);}
.opt-cell.selected{background:var(--selected-bg);border-color:var(--selected);border-width:5px;box-shadow:0 0 0 4px rgba(56,106,246,.20),0 5px 10px rgba(0,0,0,.10);}
/* SME: a correct option is marked by its OUTLINE only — no green wash inside the card. */
.opt-cell.correct{border-color:var(--correct);border-width:3px;
  box-shadow:0 0 0 3px rgba(0,177,50,.22),0 6px 14px rgba(0,177,50,.18);}
.opt-cell.wrong{border-color:var(--wrong);border-width:5px;background:var(--wrong-bg);box-shadow:0 5px 10px rgba(249,53,68,.15);}
.opt-cell .lbl{font-size:22px;font-weight:700;color:var(--navy);margin-top:4px;}

/* === DRAG / DROP === */
/* drag stage eases out of the 150px gap + single rows so 6 items fit, never clip.
   No width:100% — let it stretch as a flex item so the -90px margins expand it
   symmetrically (with width:100% the negative margins only shift it left). */
.dd-stage{display:flex;flex-direction:column;gap:26px;flex:1;min-height:0;justify-content:center;margin:0 -90px;}
.dd-tile{width:104px;height:104px;border-radius:16px;background:var(--cream);border:4px solid var(--cream-edge);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;color:var(--navy);cursor:grab;touch-action:none;box-shadow:0 5px 0 var(--cream-edge);user-select:none;position:relative;z-index:2;}
.dd-tile.dragging{background:transparent;border-color:transparent;cursor:grabbing;z-index:50;transform:scale(1.08);box-shadow:0 12px 24px rgba(56,106,246,.30);transition:none;}
.dd-tile.snapped{cursor:default;}
/* Kit drag/drop zone design: dashed border, colored fill */
.dd-zone{width:150px;height:150px;border-radius:17px;background:var(--drag-bg);border:2px dashed var(--drag-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;}
.dd-zone.hover{background:#E6F0FF;border-color:var(--selected);border-width:3px;box-shadow:0 0 0 8px rgba(56,106,246,.12),0 0 16px rgba(56,106,246,.25);}
.dd-zone.filled{border-width:3px;}
.dd-zone.filled.correct{background:var(--correct-bg);border-color:var(--correct);border-style:dashed;}
.dd-zone.filled.wrong{background:var(--wrong-bg);border-color:var(--wrong);border-style:dashed;}
/* dropped letter = small green corner badge — clear of the picture & neighbours */
.dd-tile.snapped{position:absolute;width:62px;height:62px;font-size:40px;top:-16px;right:-16px;left:auto;transform:none;border-radius:14px;background:#FFF6D8;border:3px solid var(--correct);box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:5;}
/* MATCH_DRAG_N holds WHOLE WORDS (घास, माला…), not single letters — the fixed 62px corner badge
   overflowed the zone (word poked out the top). Show the placed word as a caption chip CONTAINED
   in the picture zone, auto-width capped to the zone, font re-fit (centerInkGlyph) so long words
   shrink instead of spilling. Scoped by .md-word so other snapped .dd-tiles are untouched. */
.dd-tile.snapped.md-word{top:auto;bottom:6px;left:50%;right:auto;transform:translateX(-50%);width:auto;min-width:56px;max-width:calc(100% - 8px);height:auto;min-height:42px;padding:2px 12px;font-size:30px;border-radius:13px;}
.dd-tile.snapped.md-word .ink-glyph{font-size:30px;}
.gender-cat{width:360px;min-height:430px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:26px 20px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 22px rgba(11,61,140,.12);}
.gender-cat:hover{transform:translateY(-4px);}
.gender-cat .cat-word{font-size:34px;font-weight:800;color:var(--navy);}
.gender-cat.played{box-shadow:0 0 0 5px rgba(0,177,50,.25),0 10px 22px rgba(11,61,140,.14);}
.sort-bin{width:330px;min-height:210px;border-radius:22px;border:3px dashed #2BA79B;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;}
.sort-bin.hover{box-shadow:0 0 0 7px rgba(56,106,246,.15);}
/* [24a A5] tray ghost-slot: a placed sort card leaves a faint same-size dashed placeholder at its
   exact tray origin (holds the flex slot so remaining cards don't shift; vachan/gender parity) */
.sort-ghost{flex:0 0 auto;border-radius:16px;background:rgba(74,120,230,.06);border:2px dashed #C3D2EC;box-sizing:border-box;}
.sort-item{width:116px;height:116px;border-radius:16px;background:#fff;border:3px solid #8BBFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;touch-action:none;box-shadow:0 5px 0 rgba(11,61,140,.12);position:relative;z-index:2;}
.sort-item.dragging{background:transparent;border-color:transparent;box-shadow:none;cursor:grabbing;z-index:50;box-shadow:0 12px 24px rgba(56,106,246,.30);transition:none;}
.sort-item img{width:72px;height:72px;object-fit:contain;} .sort-item img.fallback{display:none;}
.tri-art{position:relative;display:inline-block;flex:none;line-height:1;}
.tri-art .tri-composite{width:100%;height:100%;object-fit:contain;display:block;}
.tri-art .tri-fallback{position:absolute;inset:0;display:block;}
.tri-art .tri-piece{position:absolute;object-fit:contain;display:flex;align-items:center;justify-content:center;line-height:1;}
.tri-art .tri-p1{left:0;top:0;}.tri-art .tri-p2{right:0;top:0;}.tri-art .tri-p3{left:50%;bottom:0;transform:translateX(-50%);}
.sort-item .tri-sort{width:138px;height:106px;}
.sort-item .tri-sort .tri-piece{width:58px;height:58px;font-size:50px;}
.sort-item .emoji{font-size:58px;line-height:1;} .sort-item .lbl{font-size:16px;font-weight:700;color:var(--navy);}
.sort-item.snapped{box-shadow:none;cursor:default;}
 .sort-item.snapped .emoji{font-size:44px;} .sort-item.snapped .lbl{font-size:13px;}
.sort-item.snapped .shape-svg{width:52px;height:52px;}
.opt-cell .shape-svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.10));}

/* cardinality set (stimulus) — larger, roomier */
/* objects always in a SINGLE row (no wrap → no lopsided 3+1 layouts). Extra top
   padding leaves room for the count-demo number badges to sit INSIDE the box. */
/* the count stimulus is a FLAT illustration panel (no shadow/raised-card look) so it never reads as a
   tappable answer button — only the gold-bordered option cards below are tappable */
.count-set{display:flex;flex-wrap:nowrap;gap:18px;justify-content:center;align-items:center;max-width:none;padding:44px 32px 24px;border-radius:26px;background:rgba(255,255,255,.5);border:none;box-shadow:none;}
.balance{position:relative;width:min(640px,94%);height:300px;margin:0 auto;}
.pan{position:absolute;bottom:6px;width:196px;transform:translateX(-50%);}

/* ============ VISUAL THEME — "Sunny Toybox" (opt-in via CARD.theme='toybox') ============
   Scoped under .stage.thm-toybox. It styles the CARDS / see-saw only (warm borders, depth, bigger
   targets) — it MUST NOT touch the stage background. The background is the single --bg token on EVERY
   screen, themed or not; a theme that re-tints the stage (gradient / decor wash) is the exact bug we
   kept chasing, so it is now pinned to --bg. */
.stage.thm-toybox{ background:var(--bg); }

/* option cards: warm, springy, a touch bigger than base — but sized to co-exist with the play-card */
.stage.thm-toybox .opt-cell{ background:#FFFDF7; border-color:#F7C24D; border-radius:28px;
   box-shadow:0 10px 22px rgba(214,140,20,.18); }
.stage.thm-toybox .opt-cell:hover{ transform:translateY(-5px) scale(1.02); }
.stage.thm-toybox .opt-grid{ gap:30px; }

/* see-saw: warm wooden plank + friendly pans, scaled up */
.stage.thm-toybox .balance{ width:min(720px,96%); height:320px; }
.count-set.dense{flex-wrap:wrap;max-width:700px;gap:12px;padding:22px 26px 16px;}
.combine-drag{cursor:grab;padding:14px;border-radius:22px;background:#FFF7E6;border:3px solid #FFD98A;box-shadow:0 6px 16px rgba(180,120,0,.18);touch-action:none;user-select:none;transition:box-shadow .15s,transform .15s;}
.combine-drag:hover{box-shadow:0 9px 22px rgba(180,120,0,.28);transform:translateY(-2px);}
.combine-drag.dragging{cursor:grabbing;z-index:50;}
.cdm-card{width:104px;height:104px;border-radius:20px;background:#fff;border:4px solid #8BBFFF;cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(11,61,140,.10);}
.cdm-card.dragging{z-index:50;cursor:grabbing;} .cdm-card.snapped{opacity:.3;pointer-events:none;}
.cdm-objtile{width:120px;height:120px;margin:6px auto 0;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;} .cdm-objtile.dragging{z-index:50;} .cdm-objtile.snapped{opacity:.3;}
/* ===== S02 counting refinements (SME S01 review deck) ===== */
/* scattered count-set (misconception: "total changes when objects move") — jitter via inline transform */
.count-set.scattered{padding:26px 18px;}
/* landing: TITLE first, image below and smaller (SME) */
.sg-content.title-first #sgHero{order:2;}
.sg-content.title-first .sg-title{order:1;}
.sg-content.title-first .sg-sub{order:3;}
.sg-content.title-first .sg-hand{width:84px;height:84px;}
.sg-content.title-first .sg-hand-num{font-size:30px;}
/* ============= NUMBER-SEQUENCE PATH — नंबर क्रम (MTKGA01_L02_S04) ============= */
/* additive: MEET_SEQUENCE (teach hop) · SEQUENCE_COMPLETE (fill the gap) · SEQUENCE_NEXT (pick). */
.seq-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:16px;flex:1;}
.seq-tray{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;}
.bt-dust{position:absolute;left:50%;bottom:2px;font-size:26px;pointer-events:none;animation:btDust .5s ease-out forwards;}
@keyframes btDust{0%{opacity:.85;transform:translate(-50%,0) scale(.6);}100%{opacity:0;transform:translate(-50%,-20px) scale(1.35);}}
/* landing hero — SHOW the concept on the start screen (shapes row / finger-hand / image) */
.sg-hero{display:none;align-items:center;justify-content:center;gap:18px;margin-bottom:4px;}
.sg-hero.show{display:flex;}
.sg-art .sg-hand{width:112px;height:112px;object-fit:contain;}
.sg-art .sg-hand-cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.sg-art .sg-hand-num{font-size:40px;font-weight:800;line-height:1;color:#0B3D8C;}
.sg-hero img{height:118px;width:auto;object-fit:contain;}
.sg-hero svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.12));}
.sg-title.compact{font-size:42px;}
/* ===== STORY (picture-story scenes + comprehension questions) — ported into the unified engine ===== */
.story-scene{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;width:100%;padding-top:14px;}   /* top-anchored so the caption lands mid-stage, clear of the centered आगे button */
.story-frame{width:900px;height:432px;border-radius:32px;overflow:hidden;position:relative;background:#EEF6FF;box-shadow:0 14px 40px rgba(11,42,90,.20),0 3px 10px rgba(11,42,90,.10);border:5px solid #FFF;}
.story-img{width:100%;height:100%;object-fit:cover;display:block;animation:storyKenBurns 20s ease-in-out infinite alternate;transform-origin:center center;}
@keyframes storyKenBurns{0%{transform:scale(1.02) translate(0,0);}50%{transform:scale(1.08) translate(-1.5%,-1%);}100%{transform:scale(1.05) translate(1.5%,1%);}}
.story-fallback{font-size:220px;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.story-caption{font-family:var(--font-hi);font-size:32px;color:var(--navy);font-weight:800;text-align:center;background:#FFF3C7;padding:10px 28px;border-radius:20px;box-shadow:0 4px 14px rgba(11,42,90,.10);max-width:900px;line-height:1.2;border:3px solid #FCD86B;}
/* position:relative stays — reveal/pulse overlays are anchored to it */
.opt-cell.correct{position:relative;}
/* SME: no ✓ badge on a correct option. The green border + green fill (line ~130) IS the
   correct-mark, everywhere in the game. The badge that used to live on ::after is gone. */
.opt-cell.correct::after{content:none !important;display:none !important;}
.story-q-opt-label{display:block;font-family:var(--font-hi);font-size:26px;color:var(--navy);font-weight:800;text-align:center;margin-top:6px;line-height:1.1;}
.tis-hot{position:absolute;border:none;background:transparent;cursor:pointer;border-radius:20px;padding:0;-webkit-tap-highlight-color:transparent;transition:box-shadow .18s,transform .1s;}
.tis-hot:hover{box-shadow:0 0 0 4px rgba(255,206,46,.45);}
.tis-hot:active{transform:scale(.96);}
.tis-hot.hit{box-shadow:0 0 0 6px rgba(0,177,50,.75),0 0 26px rgba(0,177,50,.55);}
.tis-hot.pulse{animation:tisPulse 1.1s ease-in-out infinite;}
@keyframes tisPulse{0%,100%{box-shadow:0 0 0 4px rgba(0,177,50,.32);}50%{box-shadow:0 0 0 9px rgba(0,177,50,.6),0 0 28px rgba(0,177,50,.55);}}
.tis-hot.shake{animation:tisShake .32s;}
/* [2026-07-31] TAP_IN_SCENE red wrong-tap flash - same ruling and same idiom as S05: box-shadow
   glow (the hotspot is a transparent overlay), removed after 700ms by app.js. */
.tis-hot.wrong-flash{box-shadow:0 0 0 6px var(--wrong),0 0 26px rgba(249,53,68,.55);}
@keyframes tisShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
/* layered-hint reveal states (A1/B2): dim the non-answers, calmly spotlight the correct one */
.opt-cell.faded{opacity:.35;filter:saturate(.6);pointer-events:none;transition:opacity .3s,filter .3s;}
@keyframes revealPulse{0%,100%{box-shadow:0 5px 12px rgba(0,177,50,.15);}50%{box-shadow:0 0 0 6px rgba(0,177,50,.28),0 10px 24px rgba(0,177,50,.30);}}
/* hero present: drop the descriptive subtitle (visual-first) + lift the block clear of the start button */
.sg-content.has-hero{margin-bottom:206px;}
.sg-content.has-hero .sg-sub{display:none;}

/* MATCH gender pairs — masculine picture tiles (bigger than letter tiles) */
.dd-tile.pic-tile{width:134px;height:134px;background:#fff;border-color:#8BBFFF;flex-direction:column;gap:2px;padding:6px;font-size:16px;}
.dd-tile.matched{opacity:.5;border-color:var(--correct);cursor:default;box-shadow:none;}

/* ===== NAV BUTTON — supplied team artwork, with matching enabled/disabled states ===== */
.nav-btn{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;width:198px;height:90px;
  background:none;border:0;padding:0;cursor:not-allowed;transition:transform .15s;display:block;}
.nav-btn img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
.nav-btn .btn-on{display:none;}
.nav-btn.active{cursor:pointer;}
.nav-btn.active .btn-on{display:block;}
.nav-btn.active .btn-off{display:none;}
.nav-btn.active{animation:nextBtnPulse 1.35s ease-in-out infinite;}
.nav-btn.active:hover{transform:translateX(-50%) translateY(-2px);}
.nav-btn.active:active{transform:translateX(-50%) translateY(3px);}
@keyframes nextBtnPulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.065);}}
/* Keep the supplied disabled artwork visible until the screen's VO + action are complete. */
.nav-btn:not(.visible){visibility:hidden;opacity:0;pointer-events:none;}
.nav-btn.visible{visibility:visible;opacity:1;}
.nav-btn{opacity:1;transition:transform .15s,background .2s,color .2s,box-shadow .2s,opacity .25s ease;}

/* ===== HINT / FEEDBACK OVERLAY — kit-style card + clean Swiftee ===== */
.hint-overlay{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:120px;z-index:60;background:rgba(11,61,140,.28);}
.hint-overlay.show{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hint-box{position:relative;width:760px;max-width:92%;min-height:300px;display:flex;align-items:center;gap:8px;background:#FCF6E3;border:3px solid #F0E5C8;border-radius:36px;box-shadow:0 18px 40px rgba(0,47,118,.28);padding:32px 44px 32px 24px;animation:popUp .3s cubic-bezier(.34,1.4,.6,1);}
@keyframes popUp{from{transform:translateY(-160%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.hint-mascot{width:240px;height:auto;flex-shrink:0;object-fit:contain;align-self:center;filter:drop-shadow(0 6px 10px rgba(0,47,118,.15));}
.hint-body{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:0 24px;}
.hint-text{font-weight:800;font-size:34px;line-height:1.35;color:var(--navy);}
.hint-text.reveal{color:#0a7a2e;font-size:32px;}
.hint-text.correct{color:#0a7a2e;font-size:38px;}
.hint-text.wrong{color:var(--wrong);}
.hint-text.hint{color:var(--navy);}
/* CORRECT/celebration popup: SAME box + SAME mascot size as every other popup
   (mascot keeps the default .hint-mascot 240px) — just centre it (no text here). */
.hint-box.celebrate{justify-content:center;align-items:center;}
.hint-box.celebrate .hint-body{display:none;}

/* ===== BOOT LOADER — [engine CSS] r4/P2: white boot screen, self-dismisses (no tap gate) ===== */
.boot-loader{position:fixed;inset:0;z-index:9999;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;}
.boot-loader img{width:118px;height:118px;object-fit:contain;}
.boot-loader.done{opacity:0;pointer-events:none;transition:opacity .4s ease;}

/* ===== TAP-TO-START GATE — uses provided title-screen art ===== */
.start-gate{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:transparent;cursor:default;}   /* [20a landing] transparent — the fixed .start-bg is the ground; [21c flag#1] cursor:default — hand-pointer belongs on .sg-btn/.sg-vo only, gate is not tap-anywhere */
.start-gate.hidden{display:none;}
/* inner white tile is the provided image (border + faint rays baked in) */
.sg-card{position:relative;width:1114px;height:456px;background:url("assets/UI/start_card.webp") center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;border-radius:34px;border:7px solid rgba(255,255,255,.94);box-shadow:0 16px 38px rgba(0,48,103,.22);}
/* ===== [r136] THE BIRTHDAY COVER — the picture inside the frame is Figma 906:119 (FLN-by-MJ,
   "start_activity_html_layout"), replacing the underwater title video. Asked: change only the picture
   inside the frame; Swiftee and the speaker chip keep their places. Every layer is Figma's own art at
   Figma's own position: the Figma frame is 1114x456 like .sg-card, and its white rim sits inside the
   frame just as this card's 7px border does, so each layer is placed at its Figma x/y minus 7px
   (children are positioned from the padding box). Layers, back to front: room · confetti · bunting ·
   balloons · title · Meera · gift. The confetti layer sits right above the room on purpose: it falls
   "in the background", behind the party.
   The birthday beat (JS adds .bc-blowing when Swiftee's intro starts sounding; t = 0 there):
     0.3s  [r137] Meera lifts the cake a little in her hands (only the cake, its plate and candles, her
           hands and left forearm move — never the whole girl) · 0.75s her face goes to a round "o"
     1.3s  three puffs of air sweep from her mouth across the candles
     1.5s  the flames lean away and go out, left to right, 0.1s apart; smoke curls from each wick
     2.35s confetti falls behind the party; her smile is back · 2.55s the cake comes back down
     ~7.6s the last confetti piece is gone — before the 8.1s intro ends and Play appears.
   Under reduced motion / ?still there is no beat: the candles stay lit and nothing falls. */
.sg-card.has-birthday-cover{background:#FBF7F1;}
.sg-card.has-birthday-cover::before{display:none;}
.sg-card.has-birthday-cover .sg-content{display:none;}
.bc-scene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bc-scene img{position:absolute;display:block;max-width:none;}
.bc-room{left:-22px;top:-105px;width:1158px;height:651px;}
.bc-confetti{position:absolute;inset:0;overflow:hidden;}
.bc-bunting{top:1px;width:185px;height:101px;}
.bc-bunting-l{left:-12px;}
.bc-bunting-r{left:940px;top:-16px;transform:scaleX(-1);}   /* Figma 906:124 is the same art mirrored */
.bc-balloons{width:80px;height:110px;}
.bc-balloons-l{left:170px;top:42px;}
.bc-balloons-r{left:828px;top:48px;}
.bc-title{left:326px;top:-17px;width:448px;height:180px;}
.bc-meera{position:absolute;left:202px;top:170px;width:164px;height:262px;}
.bc-scene .bc-meera img,.bc-meera svg{position:absolute;left:0;top:0;width:100%;height:100%;}
.bc-meera-blow{opacity:0;}
/* [r137] the two pieces that move when she lifts the cake, cut from the same art and laid exactly over
   it (boxes in % of her 228x365 picture): the cake piece (cake, candles, plate, both hands) rises 6
   picture-px; the left forearm tilts about its elbow (a vertical skew) so the wrist rises the same 6px
   and stays on the hand. The static picture under them has the strips they uncover filled with shirt. */
.bc-scene .bc-meera .bc-meera-cake{left:41.2281%;top:34.2466%;width:53.2895%;height:21.3699%;}
.bc-scene .bc-meera .bc-meera-arm{left:27.193%;top:42.4658%;width:16.6667%;height:12.6027%;transform-origin:15.789% 50%;}
.bc-gift-shadow{position:absolute;left:873px;top:374px;width:124px;height:20px;border-radius:50%;background:#F1C299;}
.bc-gift{left:849px;top:251px;width:172px;height:172px;}
/* candles: the flames are drawn here (the picture's own flames were painted out), so they can flicker
   and be blown out. Drawn in the picture's own pixel space (viewBox 228x365). */
.bc-fx{overflow:visible;}
.bc-fx *{transform-box:fill-box;}
.bc-wick{fill:none;stroke:#4A3426;stroke-width:.9;stroke-linecap:round;}
.bc-glow{fill:url(#bcGlowGrad);}
.bc-fo{fill:url(#bcFlameGrad);}
.bc-fi{fill:#FFFBE3;}
.bc-flame,.bc-flick,.bc-smoke{transform-origin:50% 100%;}
.bc-flick{animation:bcFlick var(--fd,.7s) ease-in-out var(--fdl,0s) infinite;}
.bc-smoke{fill:none;stroke:rgba(122,120,132,.85);stroke-width:1.5;stroke-linecap:round;opacity:0;}
.bc-wind path{fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:70;stroke-dashoffset:70;opacity:0;}
.bc-blowing .bc-meera-cake{animation:bcCakeLift 2.65s ease-in-out .3s both;}
.bc-blowing .bc-meera-arm{animation:bcArmLift 2.65s ease-in-out .3s both;}
.bc-blowing .bc-candles{animation:bcCandlesLift 2.65s ease-in-out .3s both;}   /* the drawn flames ride with the cake */
.bc-blowing .bc-meera-blow{animation:bcFace 2s ease-in-out .75s both;}
.bc-blowing .bc-wind path{animation:bcWind .9s ease-out calc(1.3s + var(--w, 0) * .1s) both;}
.bc-blowing .bc-flame{animation:bcOut .55s ease-in calc(1.5s + var(--i, 0) * .1s) both;}
.bc-blowing .bc-smoke{animation:bcSmoke 1.5s ease-out calc(1.95s + var(--i, 0) * .1s) both;}
@keyframes bcFlick{0%,100%{transform:scale(1,1) skewX(0deg);}25%{transform:scale(.93,1.07) skewX(3deg);}50%{transform:scale(1.05,.94) skewX(-2deg);}75%{transform:scale(.96,1.04) skewX(1.5deg);}}
/* up over 0.4s, held while she blows, down over 0.4s — one timeline for all three, so they stay together
   (6 picture-px = 4.3158 CSS px in the 164px-wide picture; tan(10.6197deg) = 6/32, elbow to wrist) */
@keyframes bcCakeLift{0%,100%{transform:translateY(0);}15%,85%{transform:translateY(-4.3158px);}}
@keyframes bcArmLift{0%,100%{transform:skewY(0deg);}15%,85%{transform:skewY(-10.6197deg);}}
@keyframes bcCandlesLift{0%,100%{transform:translateY(0);}15%,85%{transform:translateY(-6px);}}
@keyframes bcFace{0%{opacity:0;}6%,93%{opacity:1;}100%{opacity:0;}}   /* [r137] a quick swap (~0.13s each way): a slow cross-fade showed both mouths at once */
@keyframes bcWind{0%{stroke-dashoffset:70;opacity:0;}20%{opacity:.95;}70%{stroke-dashoffset:0;opacity:.8;}100%{stroke-dashoffset:-30;opacity:0;}}
@keyframes bcOut{0%{transform:skewX(0deg) scale(1,1);opacity:1;}40%{transform:skewX(-28deg) scale(1,.82);opacity:1;}100%{transform:skewX(-34deg) scale(.25,0);opacity:0;}}
@keyframes bcSmoke{0%{opacity:0;transform:translateY(0) scale(.7);}20%{opacity:.85;}100%{opacity:0;transform:translateY(-12px) scale(1.25);}}
/* confetti behind the party: the lesson's own confetti (same pieces, colours and paper motion as
   confettiCannon), sized for this picture rather than the whole screen */
.bc-confetti .p{position:absolute;top:0;left:var(--x);animation:cfFall var(--fall) linear var(--delay) both;}
.bc-confetti .w{display:block;perspective:600px;animation:cfGlide var(--rockT) linear var(--delay) infinite both;}
.bc-confetti .f{display:block;position:relative;transform-style:preserve-3d;width:calc(var(--w) * var(--z));height:calc(var(--h) * var(--z));opacity:var(--dim,1);animation:cfRock var(--rockT) linear var(--delay) infinite both;}
.bc-confetti .f.tum{animation:cfTumble var(--rockT) linear var(--delay) infinite both;}
.bc-confetti .f::before,.bc-confetti .f::after{content:"";position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.bc-confetti .f::before{background:var(--c);}
.bc-confetti .f::after{background:var(--c2);transform:rotateY(180deg);}
.bc-confetti .sq{--w:8px;--h:8px;border-radius:1px;}
.bc-confetti .rc{--w:6px;--h:13px;border-radius:1px;}
.bc-confetti .ln{--w:2.5px;--h:15px;border-radius:2px;}
.bc-confetti .st{--w:12px;--h:12px;}
.bc-confetti .st::before,.bc-confetti .st::after{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
@media (prefers-reduced-motion:reduce){ .bc-scene,.bc-scene *{animation:none !important;} }
/* A faint wash preserves title/play-button readability while keeping the supplied video visible. */
.sg-card::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(224,248,255,.16);pointer-events:none;}
/* full-body standing mascot (feet included): size by HEIGHT so the whole body incl. feet shows;
   the art frame is square with side padding, so it's constrained to the card height, not width. */
.sg-mascot{position:absolute;left:-15px;bottom:-3px;width:180px;height:auto;z-index:3;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,47,118,.18));animation:none;}
/* title block in the upper area, clear of the start-button image below */
/* [r36] Title and subtitle ride near the TOP of the card, as a heading should. They started 79px
   down; a first pass to 55px was still not clearly a change, so they now sit 27px from the card
   edge. A transform rather than a margin on purpose: it moves the two lines together and leaves
   the शुरू करें button exactly where it is. */
.sg-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:760px;text-align:center;margin-bottom:150px;transform:translateY(-62px);}
.sg-title{font-weight:600;font-size:64px;color:#012F76;line-height:1;}
.sg-title.lesson-title-arc{display:flex;align-items:flex-start;justify-content:center;gap:1px;
  font-family:"Baloo 2",var(--font-hi);font-size:68px;font-weight:900;letter-spacing:.01em;
  color:#083E91;text-shadow:0 4px 0 rgba(255,255,255,.92),0 9px 18px rgba(0,74,157,.18);
  position:relative;padding:0 18px 18px;}
.sg-title.lesson-title-arc::after{content:"";position:absolute;left:11%;right:11%;bottom:0;height:14px;
  border-bottom:5px solid rgba(242,128,30,.72);border-radius:0 0 55% 55%;filter:drop-shadow(0 3px 2px rgba(242,128,30,.14));}
.sg-title.lesson-title-arc .arc-letter{display:inline-block;min-width:.12em;transform-origin:50% 100%;}
.sg-title.lesson-title-arc .arc-space{width:.34em;}
.sg-sub{font-weight:700;font-size:28px;color:var(--navy-dk);opacity:.9;}
/* r4: landing concept strip — SHOW the 3 ordering concepts (size/length/weight) as images, not words (Shruti pattern) */
.sg-art{display:flex;gap:46px;align-items:flex-end;justify-content:center;margin-top:10px;}
/* r4/P4: staggered pop-in — paused until body.loaded (set when the boot loader dismisses) */
.sg-acell{display:flex;flex-direction:column;align-items:center;gap:6px;animation:fingerPop .5s cubic-bezier(.34,1.5,.6,1) both;animation-play-state:paused;}
body.loaded .sg-acell{animation-play-state:running;}
.sg-acell:nth-child(1){animation-delay:.15s;}
.sg-acell:nth-child(2){animation-delay:.60s;}
.sg-acell:nth-child(3){animation-delay:1.05s;}
@keyframes fingerPop{0%{opacity:0;transform:scale(.2);}70%{opacity:1;transform:scale(1.18);}100%{opacity:1;transform:scale(1);}}

.sg-acell .sg-alabel{font-weight:800;font-size:24px;color:var(--navy);}
/* r4: concept-strip visual examples (words dropped) — each tile previews the ordering task itself */
.sg-ex{height:106px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 5px 7px rgba(0,47,118,.16));}
.sg-ex-size{align-items:flex-end;gap:9px;}
.sg-ex-size .sg-disc{border-radius:50%;background:#4EA3F0;border:3px solid #2C7BD1;flex:0 0 auto;}
.sg-ex-len{flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;width:110px;}

.sg-ex-wt svg{width:122px;height:106px;display:block;}
/* start button = supplied Play artwork; disabled swaps to the matching waiting state */
.sg-btn{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:4;width:214px;height:92px;
  background:none;border:0;padding:0;cursor:pointer;animation:sgBtnPulse 1.4s ease-in-out infinite;}
.sg-btn img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
.sg-btn .btn-wait{display:none;}
.sg-btn:disabled{cursor:not-allowed;animation:none;}
.sg-btn:disabled .btn-play{display:none;}
.sg-btn:disabled .btn-wait{display:block;}
.sg-btn:active{transform:translateX(-50%) translateY(3px);}
@keyframes sgBtnPulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.075);}}
/* After the landing VO ends, the play button becomes the only moving foreground element.
   The soft, outer sky/glow decoration remains as background motion. [r136] The cover's birthday beat
   (candles, confetti) has finished by then; this freezes the scene in its resting state. */
body.is-start.landing-play-ready .sg-card :not(.sg-btn):not(.sg-btn *){animation-play-state:paused!important;}
body.is-start.landing-play-ready .sg-btn:not(:disabled){animation:sgBtnPulse 1.35s ease-in-out infinite;}
/* [r59] NO PLAY BUTTON UNTIL THE INTRO HAS FINISHED. The title screen showed a still yellow Play
   before the intro, swapped it for the grey "waiting" Play while the intro spoke, and only then made
   it yellow and pulsing. Now there is no Play button at all — neither grey nor yellow — until the
   intro completes; then the yellow one fades in and pulses exactly as before.
   `landing-play-ready` is the existing signal for "the intro has played and nothing is speaking"
   (setPlaying), so this needs no timer of its own: a replay from the speaker chip hides Play again
   for the length of the replay and brings it back afterwards.
   Never stranded: when the browser blocks autoplay, play() ends the attempt at once and the same
   signal turns on, so Play appears rather than leaving the child with nothing to press — and the
   first tap anywhere other than Play still starts the real intro (the pointerdown fallback below). */
body.is-start .sg-btn{opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility 0s linear .35s;}
body.is-start.landing-play-ready .sg-btn{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .35s ease,visibility 0s;}
/* [r136] PLAY COMES STRAIGHT AFTER THE INTRO — NO LOADING BAR. Asked: remove the loading bar at the Play
   button; Play appears as soon as Swiftee's intro is over and starts pulsing at once, as before.
   (Was [opt]: Play waited for body.assets-ready, with a 0–100% bar standing in its place.) The preloader
   still warms every asset in the background; it just no longer holds Play back. */
body.is-start.landing-play-ready .sg-btn:not(:disabled){
  animation:sgBtnPopIn .5s cubic-bezier(.34,1.56,.64,1) both,sgBtnPulse 1.35s ease-in-out .5s infinite;}
@keyframes sgBtnPopIn{0%{opacity:0;transform:translateX(-50%) scale(.35);}70%{opacity:1;transform:translateX(-50%) scale(1.1);}100%{opacity:1;transform:translateX(-50%) scale(1);}}
@media (prefers-reduced-motion:reduce){ body.is-start.landing-play-ready .sg-btn:not(:disabled){animation:none;} }
/* landing "listen" button — a warm welcome plays on the title screen; tap to replay */
.sg-vo{position:absolute;left:96px;bottom:-6px;z-index:5;width:58px;height:58px;background:none;border:none;padding:0;cursor:pointer;animation:none;}   /* Slightly raised so the speaker chip clears the white frame edge; size and horizontal placement stay unchanged. */
.sg-vo img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.sg-vo:active{transform:scale(.92);}

/* ===== NUDGE HAND — kit asset ===== */
.nudge-hand{position:absolute;width:96px;height:96px;z-index:55;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));animation:nudgeMove 1s ease-in-out infinite;display:none;}
.nudge-hand img{width:100%;height:100%;object-fit:contain;}
.nudge-hand.show{display:block;}
@keyframes nudgeMove{0%,100%{transform:translateY(2px);}50%{transform:translateY(-14px);}}  /* [20a] restored — was deleted while .nudge-hand still referenced it -> static nudge */


/* ===== END / CELEBRATION ===== */
.end-screen{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:transparent;overflow:hidden;}
/* r4: immersive celebration (adopted from Shruti's build — end_screen.webp sunburst + centred mascot + subtitle) */
.end-bg{position:fixed;inset:0;background:#FDE9A8 url("assets/UI/end_screen.webp") center/cover no-repeat;display:none;pointer-events:none;z-index:0;}
body.is-end .end-bg{display:block;}
body.is-end{background:#FDE9A8 !important;}
body.is-end .stage{background:transparent !important;}
body.is-end .stage-inner{visibility:hidden;}
.end-subtitle{font-weight:800;font-size:28px;color:var(--navy);text-align:center;z-index:3;margin:0 0 4px;}
.end-subtitle:empty{display:none;}
.end-screen .end-title{font-size:56px;color:var(--navy-dk);}
.end-screen .end-mascot{width:330px;z-index:2;filter:none;}   /* [r135] asked: no faint box beside Swiftee — the navy drop-shadow got clipped to the image box on the GPU and showed as a semi-transparent panel */
.end-screen.show{display:flex;}
.end-title{z-index:3;font-family:var(--font-hi);font-weight:800;font-size:44px;color:#0B3D8C;text-align:center;max-width:78%;line-height:1.25;text-shadow:0 2px 0 rgba(255,255,255,.7);animation:endPop .5s cubic-bezier(.34,1.5,.6,1);}
.end-title:empty{display:none;}
.end-mascot{width:240px;height:auto;object-fit:contain;font-size:200px;line-height:1;filter:drop-shadow(0 12px 22px rgba(0,47,118,.22));animation:endPop .55s cubic-bezier(.34,1.5,.6,1);z-index:2;}
@keyframes endPop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
/* final action = supplied Finish artwork */
.end-btn{display:none;z-index:3;width:163px;height:117px;background:none;border:0;padding:0;cursor:pointer;}
.end-btn img{width:100%;height:100%;display:block;pointer-events:none;}
.end-btn.show{display:block;animation:hintPop .4s cubic-bezier(.34,1.5,.6,1);}
.end-btn:active{transform:translateY(3px);}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.confetti i{position:absolute;top:-24px;width:12px;height:18px;border-radius:2px;opacity:.95;animation:confettiFall linear infinite;}
@keyframes confettiFall{0%{transform:translateY(-24px) rotate(0);}100%{transform:translateY(820px) rotate(720deg);}}
/* ---- game-feel: slide entrance + success sparkle particles + correct pop ---- */
.slide-in{animation:slideIn .34s cubic-bezier(.2,.85,.3,1) both;}
@keyframes slideIn{from{opacity:0;transform:translateY(16px) scale(.985);}to{opacity:1;transform:none;}}
.spark{position:absolute;font-size:30px;line-height:1;pointer-events:none;z-index:60;transform:translate(-50%,-50%);animation:sparkFly .9s ease-out both;}   /* [24a N10] fill-mode BOTH: stars must not sit stacked visible at the spawn point during their stagger delay (HI01H08 confetti-class fix) */
@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}18%{opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(22deg);opacity:0;}}
.opt-cell.correct{animation:correctPop .45s cubic-bezier(.3,1.4,.5,1);}
@keyframes correctPop{0%{transform:scale(1);}45%{transform:scale(1.08);}100%{transform:scale(1);}}
/* ---- feedback v2: tap-to-answer buzz + RED RING (no ✕) · side confetti · dynamic Swiftie ----
   [27a] The 110px red ✕ is GONE (Yasir ruling 2026-07-27 = blocked ruling (a), and strilling parity).
   The wrong card now reads as a red ring, stays full-opacity, and app.js unblocks it after 700ms so
   the child can retry; from the 2nd wrong attempt .crossed persists and the card stays disabled.
   opacity stays 1 because a re-tappable card must not look dead; transition:none keeps the ring from
   fading in through .opt-cell's box-shadow transition, so the buzz reads instantly. */
/* NB: !important goes ONCE at the END of a multi-value box-shadow — putting it after each shadow
   makes the whole declaration invalid and it is dropped silently (caught in browser, 27a). */
.opt-cell.crossed{opacity:1;pointer-events:none;border-color:var(--wrong);background:var(--wrong-bg);position:relative;animation:buzzShake .4s;transition:none !important;box-shadow:0 0 0 4px var(--wrong),0 6px 14px rgba(249,53,68,.25) !important;}
@keyframes buzzShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
/* FLN toolkit: correct-answer confetti uses paper physics rather than the old
   single-shape spin. Path, glide and face each own one transform animation so
   pieces can fall, flutter and turn over independently. */
.fx-confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100001;}
.fx-confetti .p{position:absolute;top:0;left:var(--x);animation:cfFall var(--fall) linear var(--delay) both;}
.fx-confetti .w{display:block;perspective:600px;animation:cfGlide var(--rockT) linear var(--delay) infinite both;}
.fx-confetti .f{display:block;position:relative;transform-style:preserve-3d;width:calc(var(--w) * var(--z));height:calc(var(--h) * var(--z));opacity:var(--dim,1);animation:cfRock var(--rockT) linear var(--delay) infinite both;}
/* [r112] as in the reference game (its .fx-layer rule): every piece is sized with the stage (--scale) at 1.5x the kit size */
.fx-confetti .f{width:calc(var(--w) * var(--z) * var(--scale, 1) * 1.5);height:calc(var(--h) * var(--z) * var(--scale, 1) * 1.5);}
.fx-confetti .f.tum{animation:cfTumble var(--rockT) linear var(--delay) infinite both;}
.fx-confetti .f::before,.fx-confetti .f::after{content:"";position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.fx-confetti .f::before{background:var(--c);}
.fx-confetti .f::after{background:var(--c2);transform:rotateY(180deg);}
.fx-confetti .sq{--w:8px;--h:8px;border-radius:1px;}
.fx-confetti .rc{--w:6px;--h:13px;border-radius:1px;}
.fx-confetti .ln{--w:2.5px;--h:16px;border-radius:2px;}
.fx-confetti .st{--w:11px;--h:11px;}
.fx-confetti .st::before,.fx-confetti .st::after{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
@keyframes cfFall{0%{transform:translate(0,-40px);opacity:0;}5%{opacity:1;}86%{opacity:1;}100%{transform:translate(var(--drift,0px),var(--dist,820px));opacity:0;}}
@keyframes cfGlide{0%{transform:translate(calc(var(--sway) * -1),0);}45%{transform:translate(var(--sway),calc(var(--bob) * -1));}50%{transform:translate(var(--sway),0);}95%{transform:translate(calc(var(--sway) * -1),calc(var(--bob) * -1));}100%{transform:translate(calc(var(--sway) * -1),0);}}
@keyframes cfRock{0%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(var(--amp));}45%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(calc(var(--amp) * .86));}50%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(calc(var(--amp) * -1));}95%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(calc(var(--amp) * -.86));}100%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(var(--amp));}}
@keyframes cfTumble{0%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(0deg);}42%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(72deg);}58%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(108deg);}100%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(180deg);}}
.mascot-wrap{position:absolute;left:var(--mascot-left,16.5px);top:var(--mascot-top,18px);width:var(--mascot-size,132px);height:var(--mascot-size,132px);z-index:40;cursor:pointer;}
.mascot-circle{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:#9DDBF5;border:4px solid #FFFFFF;box-shadow:0 6px 14px rgba(0,47,118,.20);}
.mascot-img{width:100%;height:100%;display:block;object-fit:cover;}
/* Match HI01H05_L02_S01: reaction WebPs own the full circle and include
   transparent canvas for the hands, stars, and bulb outside it. Keep the
   wrapper's position/size fixed and remove clipping only while reacting. */
.mascot-wrap.anim .mascot-circle{overflow:visible !important;background:transparent !important;border:none !important;box-shadow:none !important;}
.mascot-wrap.anim .mascot-circle .mascot-img{position:static !important;inset:auto !important;width:100% !important;height:auto !important;object-fit:contain !important;transform:none !important;}


/* ===== DEV VALIDATOR BANNER ===== */
.dev-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:99;background:#1a1a1a;color:#ff7;font-family:monospace;font-size:12px;padding:6px 12px;border-radius:6px;display:none;max-width:80%;}
.dev-banner.show{display:block;}
.dev-banner.ok{color:#7fff7f;}

/* ===== PHASE TRANSITION (additive full-screen beat between arc phases — the "learning journey") ===== */
.phase-transition{width:100%;min-height:100%;flex:1;align-self:stretch;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;border-radius:28px;
  background:radial-gradient(circle at 50% 38%,#EAF4FF 0%,var(--band-bg) 55%,#CFE6FF 100%);
  animation:slideIn .34s cubic-bezier(.2,.85,.3,1) both;}

/* ===== PHASE-TRANSITION PEEK GATE — [engine CSS] r4/P1 (Shruti's peek beat; kept ALONGSIDE our journey-map above) =====
   Overlay (not a frame): blur the stage behind, Swiftie peeks up from the BOTTOM, a big magenta headline over it.
   NB: our stage self-contains landing+slides (no fixed .start-bg sibling), so the wash lives INSIDE the 1333×750
   stage (inset:0) → no letterbox seam, no body-level ::after needed. */
.phase-gate{position:fixed;inset:0;width:100vw;height:100dvh;z-index:100000;overflow:hidden;display:none;align-items:flex-end;justify-content:center;background:rgba(57,55,55,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:default;}
.phase-gate.show{display:flex;}
/* [r110] as in the reference game: when the gate's line is done Swiftie drops back below the edge (0.34s,
   ease-in) before the gate lifts */
.phase-gate.pg-sink #phaseGateImg{animation:pgSinkDown .34s ease-in both !important;}
@keyframes pgSinkDown{from{transform:translateY(0);}to{transform:translateY(100%);}}
@media (prefers-reduced-motion:reduce){ .phase-gate.pg-sink #phaseGateImg{animation:none !important;} }
/* [r60] SWIFTY AT THE REFERENCE GAME'S SIZE. clamp(190px,29vh,285px) drew him ~217px tall on a
   1333x750 screen; the reference (HI02H11_L03_S02) uses 52.8% of the screen height, never over
   624px or wider than 92% of the screen — 396px here. Both games show the same animation (the
   reference's file is a time-cut of the standard peeking.webp, square like ours), so matching the
   box matches the bird. Square and bottom-anchored, as there. Our own rise animation is unchanged. */
.phase-gate #phaseGateImg{height:min(52.8vh,624px,92vw);width:min(52.8vh,624px,92vw);max-width:none;object-fit:contain;display:block;pointer-events:none;z-index:1;animation:pgAppear .25s ease-out both;}
/* [r82] no rise from below any more — she is already up when the gate opens; a quick fade only */
@keyframes pgAppear{from{opacity:0;}to{opacity:1;}}
.stage.gating .header-row{visibility:hidden;}          /* header hides while the gate is up */
.stage.gating .mascot-wrap{visibility:hidden;}            /* one-Swiftie: the peeking Swiftie is the only one during a gate */
/* magenta headline with a thick white stroke (Lilita One if present, else Baloo 2 fallback) */
/* [r60] THE HEADLINE AS THE REFERENCE GAME DRAWS IT: 96px magenta with a white outline 10.4% of
   the letter, 271px from the top on a normal screen — scaled on a small one (--pgf), and lifted if
   it would reach the bird. It still appears only when the voice reaches the words (text-speaking,
   unchanged), but now it WRITES ITSELF LEFT TO RIGHT — the reference's pgWipe, a clip-path that
   uncovers the line from its first letter to its last in 0.9s — instead of fading in. The -24px
   insets leave room for the outline and the matras so nothing is clipped once it is fully shown. */
.phase-gate{--pgf:min(96px,12.8vh,13vw);}
.pg-title{position:absolute;left:50%;transform:translateX(-50%);z-index:3;
  top:max(8px, min(271px, calc(58.8vh - 1.2 * var(--pgf) - 12px)));
  width:max-content;max-width:94vw;white-space:nowrap;
  font-family:'Lilita One',var(--font-hi);font-weight:800;font-size:var(--pgf);line-height:1.14;
  letter-spacing:0;text-align:center;color:#CD0FD5;
  -webkit-text-stroke:calc(var(--pgf) * 0.104) #FFFFFF;paint-order:stroke fill;visibility:hidden;}
.phase-gate.text-speaking .pg-title{visibility:visible;animation:pgWipe .9s cubic-bezier(.25,.6,.3,1) both;}
@keyframes pgWipe{from{clip-path:inset(-24px 100% -24px -24px);}to{clip-path:inset(-24px -24px -24px -24px);}}
/* "vh" on a tablet counts the browser bars as hidden; svh is the height the child actually sees */
@supports (height: 1svh){
  .phase-gate{--pgf:min(96px,12.8svh,13vw);}
  .pg-title{top:max(8px, min(271px, calc(58.8svh - 1.2 * var(--pgf) - 12px)));}
  .phase-gate #phaseGateImg{height:min(52.8svh,624px,92vw);width:min(52.8svh,624px,92vw);}
}
.pg-title:empty{display:none;}
/* First gate (landing → tutorial): the landing lives INSIDE the stage (not stage-inner), so blur it
   directly; the wash above gives the frosted look, Swiftie + headline stay sharp on top. */
/* [20a PT-4] gate is a transparent-dark full-viewport overlay - keep the page behind it
   painted (blurred + colourful), never a flat panel. app.js toggles body.gating. */
body.gating{background:transparent;}
body.gating .stage-wrap{background:transparent;}
.stage.gating .start-gate{filter:blur(5px);pointer-events:none;}

/* ===== TEACHING / TUT-CARD FRAME — [engine CSS] r4/F1 (grid-paper teaching card) =====
   Routed by mountSlide when slide.phase==='tutorial' (type-agnostic). Header hidden; prompt lives IN
   the card; the full standing Swiftie straddles the bottom-left corner with a shoulder audio chip. */
.stage.tut{background:#FFFFFF;}
body.tut-page{background:#FFFFFF;}
.stage.tut .header-row{display:none;}
.stage.tut .mascot-wrap{display:none;}          /* header avatar off — the tut-mascot is the only Swiftie */
.stage.tut .slide-stage{padding:96px 100px 92px;}
.tut-card{flex:1;min-height:0;position:relative;border:10px solid #50AAF2;border-radius:34px;
  background-color:#F2F7FA;
  background-image:linear-gradient(to right,rgba(111,150,216,.16) 1.5px,transparent 1.5px),
                   linear-gradient(to bottom,rgba(111,150,216,.16) 1.5px,transparent 1.5px);
  background-size:46px 46px;
  box-shadow:0 6px 18px rgba(11,61,140,.10);
  display:flex;flex-direction:column;overflow:visible;}
.tut-prompt{flex-shrink:0;min-height:118px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:800;font-size:64px;color:#012F76;padding:12px 60px 0;line-height:1;white-space:nowrap;}
.tut-content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 30px;}
.tut-card::after{content:"";flex-shrink:0;height:132px;}    /* reserves room for the straddling mascot */
.tut-mascot{position:absolute;left:-34px;bottom:-14px;height:190px;width:auto;z-index:3;pointer-events:none;}
.tut-audio{position:absolute;left:78px;bottom:-16px;width:58px;height:58px;z-index:4;cursor:pointer;}   /* [25c] 96 -> 78 = the strilling reference: chip sits ON Swiftie's leg (~74% of the mascot width) instead of drifting off her right side at ~84% (Yasir 2026-07-25; this was gap #7 in _ENGINE_GAP_AUDIT_2026-07-25.md) */
.tut-audio img,.tut-audio svg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));}
/* [30j] audio-chip throb removed — Yasir: the button must not move while a clip
   plays. .playing is still toggled; it just no longer scales the button. */   /* r4/F1: pulse while VO plays (shares setPlaying's .playing toggle) */
.stage.tut .nav-btn{left:50%;right:auto;bottom:128px;transform:translateX(-50%);}
/* [25d] TERMINAL-HELP pair (ported from the strilling reference, which has .reveal-hold at its
   line ~545 and the dimming inline). .reveal-glow stops after 2 pulses, so it cannot express
   "keep breathing until the child places it" — .reveal-hold is the same pulse, infinite. */
.reveal-hold{animation:revealPulse 1.3s ease-in-out infinite;}
.sentence-word{background:#fff;border:3px solid #C7DCF7;border-radius:20px;padding:18px 30px;
  font-family:var(--font-hi);font-weight:800;font-size:60px;color:var(--navy);line-height:1.1;position:relative;
  box-shadow:0 8px 20px rgba(11,61,140,.12);transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;}
.sentence-word .sw-text{font-size:60px;font-weight:800;color:var(--navy);}
.sentence-word.said{background:#EAF3FF;border-color:#8BBFFF;}
.sentence-word.correct{border-color:var(--correct);background:var(--correct-bg);box-shadow:0 5px 12px rgba(0,177,50,.18);}
/* [27a] ✕ dropped here too, so tap-a-word speaks the same visual language as the pick cards.
   DELIBERATE difference from .opt-cell.crossed: this one keeps opacity:.55 + the permanent lock,
   because only the pick path got the 700ms retry — a card that really is dead must still LOOK dead.
   If the retry is ever extended to SENTENCE_* , raise opacity to 1 in the same edit. */
.sentence-word.crossed{border-color:var(--wrong);background:var(--wrong-bg);opacity:.55;pointer-events:none;animation:buzzShake .4s;box-shadow:0 0 0 3px var(--wrong);}
.read-whole-btn{font-family:var(--font-hi);font-weight:800;font-size:38px;color:#fff;background:var(--selected,#386AF6);
  border:none;border-radius:9999px;padding:18px 52px;cursor:pointer;box-shadow:0 8px 0 rgba(11,61,140,.25),0 12px 24px rgba(56,106,246,.28);
  transition:transform .12s,box-shadow .12s;}
.read-whole-btn:hover{transform:translateY(-2px);}
.read-whole-btn:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(11,61,140,.25);}
.read-whole-btn.playing{background:#2BA79B;}
.read-whole-btn.done{background:var(--correct);box-shadow:0 8px 0 rgba(0,140,40,.25);}
.dd-stage.seq-words .dd-tile{width:auto;min-width:104px;height:auto;min-height:84px;padding:12px 26px;font-size:44px;}
.dd-stage.seq-words .dd-tile .ink-glyph{font-size:44px;}
.tap-all-item{width:180px;min-height:186px;background:#fff;border:3px solid #EEF3FA;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:12px;position:relative;box-shadow:0 10px 24px rgba(11,61,140,.12);transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;}
.tap-all-item:hover{transform:translateY(-3px);border-color:var(--selected);}
.tap-all-item .img{width:118px;height:118px;object-fit:contain;} .tap-all-item .img.fallback{display:none;}
.tap-all-item .emoji{font-size:96px;line-height:1;}
.tap-all-item .lbl{font-size:24px;font-weight:800;color:var(--navy);}
.tap-all-item.got{border-color:var(--correct);background:var(--correct-bg);box-shadow:0 6px 14px rgba(0,177,50,.18);}
/* [27a] ✕ dropped (third and last ✕ site) — red ring only, same language as the pick cards.
   SME UPDATE: the ✓ on .got is dropped too, so no correct-mark appears anywhere in the game.
   The banked state is still legible from the green border + green fill on .got (line above),
   which is the same correct-mark language the pick cards now use. Lock/dim kept, as with
   .sentence-word. */
.tap-all-item.got::after{content:none !important;display:none !important;}
.tap-all-item.nope{border-color:var(--wrong);background:var(--wrong-bg);opacity:.55;pointer-events:none;animation:buzzShake .4s;box-shadow:0 0 0 3px var(--wrong);}
.sg-sub:empty{display:none;}   /* [20a SORT-01] one-by-one tray reveal */
/* DEV NAV (?dev=1 / ?nav=1 only — never shown to children) */
.dev-nav{position:fixed;bottom:8px;right:8px;z-index:99999;display:flex;align-items:center;gap:5px;background:rgba(18,26,44,.9);border-radius:11px;padding:5px 8px;box-shadow:0 6px 22px rgba(0,0,0,.35);font-family:system-ui,Arial,sans-serif;opacity:.9;}
.dev-nav:hover{opacity:1;}
.dev-nav-btn{background:#2b3a55;color:#fff;border:none;border-radius:8px;padding:6px 11px;font-size:15px;line-height:1;cursor:pointer;}
.dev-nav-btn:hover{background:#3c5278;}
.dev-nav-btn:active{transform:translateY(1px);}
.dev-nav-sel{border:none;border-radius:8px;padding:4px 6px;font-size:12px;max-width:150px;background:#eef2f8;color:#12203c;cursor:pointer;}
.dev-nav-lbl{color:#fff;font-size:13px;font-weight:700;min-width:78px;text-align:center;letter-spacing:.02em;}

/* [figma-port 20a] animated speaker chip — both arcs SHOWN at rest, cycling 0->1->2 while playing */
.audio-chip svg{width:100%;height:100%;display:block;}
.sg-vo svg{width:100%;height:100%;display:block;}
.audio-chip .wv{opacity:1;}
.sg-vo .wv{opacity:1;}   /* drawn at rest. Never !important here: the wv1/wv2 keyframes must stay free to cycle the arcs while a clip plays. */
.audio-chip.playing .wv1{animation:wv1 1.2s steps(1) infinite;}
.audio-chip.playing .wv2{animation:wv2 1.2s steps(1) infinite;}
.sg-vo.playing .wv1{animation:wv1 1.2s steps(1) infinite;}
.sg-vo.playing .wv2{animation:wv2 1.2s steps(1) infinite;}
.tut-audio.playing .wv1{animation:wv1 1.2s steps(1) infinite;}
.tut-audio.playing .wv2{animation:wv2 1.2s steps(1) infinite;}
@keyframes wv1{0%{opacity:0;}33%{opacity:1;}100%{opacity:1;}}
@keyframes wv2{0%{opacity:0;}66%{opacity:1;}100%{opacity:1;}}

/* [20a PT-5] the gate's backdrop-filter is the only blur during gating (avoid compounding) */
body.gating .stage.blurred .stage-inner{filter:none;}
body.gating .stage.gating .start-gate{filter:none;}

/* [20a hint-03/05] bulb-only ray glow; never dim while glowing */
.hint-btn .bulb-rays{opacity:0;}
.hint-btn.hint-glow .bulb-rays{opacity:1;animation:bulbRays 1.1s ease-in-out infinite;}
.hint-btn.hint-glow .bulb{filter:drop-shadow(0 0 6px #fff);}
@keyframes bulbRays{0%,100%{opacity:.25}50%{opacity:1}}
.hint-btn.hint-glow:disabled{opacity:1;}

/* [20a VA-5] wave arcs visible at rest on every speaker chip */
/* The arcs BELONG to the speaker icon, so they are drawn at rest — a bare speaker read as an empty
   button. They are static while nothing is sounding; the back-and-forth cycle below is what marks
   "a voice is playing right now". */
.audio-chip .wv,.tut-audio .wv,.sg-vo .wv{opacity:1;animation:none;transition:opacity .15s ease;}
.audio-chip.playing .wv,.tut-audio.playing .wv,.sg-vo.playing .wv{opacity:1;}
.audio-chip.playing .wv1,.tut-audio.playing .wv1,.sg-vo.playing .wv1{animation:wv1 1.2s steps(1) infinite;}
.audio-chip.playing .wv2,.tut-audio.playing .wv2,.sg-vo.playing .wv2{animation:wv2 1.2s steps(1) infinite;}
/* [20a] landing "listen" button reads as DEAD when static (Yasir review) — its sound-waves gently cycle at rest
   as a tap-me invitation, independent of playback. In-lesson header/tut chips stay static-at-rest (ruling B4). */
/* [20a] landing listen-button: arcs animate ONLY while its VO plays (via .sg-vo.playing .wv above, driven
   by setPlaying) — exactly like the in-lesson chip; STATIC at rest (Yasir: "arcs keep animating even when
   no audio"). No continuous rule here on purpose. */

/* [20a nudge] production two-layer press nudge */

/* Preserve the original outer title backdrop; only the content inside the card changes. */
.start-bg{position:fixed;inset:0;background:#47BCFD url("assets/UI/startnew_bg_plain.webp") center/cover no-repeat;display:none;pointer-events:none;z-index:0;}
body.is-start .start-bg{display:block;}
body.is-start .stage-inner{visibility:hidden !important;}
body.is-start .stage{background:transparent !important;}
body.is-start .phase-gate{background:rgba(57,55,55,.6) !important;}
.sg-art .shape-svg{filter:drop-shadow(0 5px 7px rgba(0,47,118,.16));}

/* ===== [27g] BOX-FREE TEACHING CONTENT — the 2026-07-23 lead ruling, finally implemented =====
   Gap #15 in _ENGINE_GAPS_CONFIRMED_2026-07-27.md ("teaching IMAGES are box-free"): the engine
   framed every teaching picture in a card while the blessed strilling fork shows the art naked on
   the grid. Yasir 2026-07-27, with the strilling ladka/ladki frame as reference: "we dont have to
   have the card, literally just the image and other things as transparent background."

   SCOPE = teaching content on TEACH SLIDES ONLY, and deliberately ALL of it (his ruling), not just
   the picture: flattening the picture alone left MEET_LETTER as a framed cream letter box -> arrow
   -> naked picture, which reads worse than either end state.

   NOT TOUCHED, on the same ruling ("interactive tap/sort/match boxes are NOT touched"):
   .opt-cell (the card IS the touch target, and it carries the red wrong-answer ring), .dd-zone,
   .sort-bin, .gender-badge, .cat-title. The `.stage.tut` scope enforces that by construction --
   any guided/practice use of these same boxes stays framed.

   Late in the file on purpose: it must outrank the base rules at 66, 73, 90, 224, 635. */
.stage.tut .meet-letter-box,
.stage.tut .stimulus-pic{
  background:transparent;
  border:none;
  box-shadow:none;
}

/* ===== [27h] F1 — TALL TUTORIAL MODULES MUST FIT THE TUTORIAL CARD =====================
   REGRESSION, not new debt. The 25e/27c tutorial-fit change shortened every tut-card by 87px, and
   that handoff predicted this in writing: "every game's tutorial card is now 87px shorter ... other
   games' tutorial slides have NOT been checked for overflow". Four games then reported it.

   Measured on HIKGH07_L01_S02 T1 at 1440x900 (--scale 1.08), design px:
       .tut-content  240 -> 558   =  318px available
       .story-scene  height        =  524px   (frame 432 + caption 64 + gap 14 + pad 14)
   The 206px overflow escapes BOTH ways because .tut-content is justify-content:center — 90px UP over
   .tut-prompt (heading 81-100% hidden) and the rest DOWN under .nav-btn (caption 59px behind the
   आगे pill). So ONE fix clears both reported findings.

   Approach: let the picture SHRINK instead of pushing the layout apart — which is also literally what
   the SME asked ("decrease the size of the picture — heading is not fully visible"). The frame keeps
   its 900x432 aspect and .story-img is already width/height:100% + object-fit:cover, so a shorter
   frame simply crops less tall. Scoped to .stage.tut ONLY: guided/practice STORY_SCENE measured
   clean and must not move.

   Same family for GENDER_INTRO, whose .gender-cat min-height:430px overflows the same 318px track
   (HI01H05_L01_S01 T3: cards sat on the prompt, leaving only "ध्या...ो। ह...नो।" readable). Its
   guided-phase twin G4 measured perfect, which is what proved it was the frame and not the module. */
.stage.tut .story-scene{height:100%;min-height:0;justify-content:center;padding-top:0;gap:10px;}
.stage.tut .story-frame{flex:1 1 auto;min-height:0;height:auto;aspect-ratio:900/432;
                        width:auto;max-width:min(900px,100%);max-height:100%;}
.stage.tut .story-caption{flex:0 0 auto;font-size:28px;padding:8px 22px;}
.stage.tut .gender-cat{min-height:0;max-height:100%;padding:16px 16px;gap:8px;}

/* ===== [27i] TEACHING IMAGES CARRY NO CONTAINER AT ALL =====================================
   Yasir, correcting me twice: "images in teaching/tutorial should not have any container, only
   image with transparent BG." 27g flattened .meet-pic-box / .meet-letter-box / .intro-pic but MISSED
   .story-frame, and 27h then made that frame SMALLER instead of removing it — so STORY_SCENE teach
   slides still showed the picture inside a white rounded card with a 5px border and a drop shadow.
   Now the frame is purely a layout box: no background, no border, no shadow, no rounding, no clip.

   object-fit also has to change: `cover` CROPS to the 900x432 box, which is wrong once there is no
   frame to crop to — with transparent art it would slice the artwork. `contain` shows the whole
   image and lets the transparency read against the grid paper.

   Still .stage.tut-scoped: guided/practice keep the framed presentation, which is the same
   interactive-vs-teaching split as the 2026-07-23 ruling. */
.stage.tut .story-img{object-fit:contain;}

/* [r21] ONE picture card for every illustration in the lesson ------------------------------
   The frame used to be stripped on tutorial screens, which left each scene as a bare rectangle
   with hard 90-degree corners and no outline. Every story picture, every comparison picture and
   the सहेली scene now share the same treatment — rounded corners, a light-blue hairline and a
   cream mat — held in these four variables so they cannot drift apart again. */
:root{
  --pic-radius:26px;
  --pic-border:4px solid #B9DDFF;
  --pic-mat:#FFF7E8;
  --pic-shadow:0 8px 20px rgba(11,42,90,.12);
}
.stage.tut .story-frame,
.stage .story-frame,
.stage .cmpv-pic{
  background:var(--pic-mat);
  border:var(--pic-border);
  border-radius:var(--pic-radius);
  box-shadow:var(--pic-shadow);
  overflow:hidden;
  /* The card hugs its picture: the width is derived from the height through the artwork own
     ratio, so the cream mat never shows as bars down the sides. An explicit width elsewhere in
     the stylesheet was what forced the old letterboxed box. */
  width:auto;
  height:88%;                            /* [r22] a touch smaller, and it lifts the art off the top edge */
  aspect-ratio:var(--pic-ratio, 1672/941);
  max-width:none;                        /* a % cap here resolves against a box this element sizes */
  flex:0 0 auto;
  min-width:0;
  box-sizing:border-box;
}
.stage .story-frame .story-img,
.stage .cmpv-pic img{
  width:100%;
  height:100%;
  object-fit:contain;                    /* never crop — the character is the point of the picture */
  border-radius:calc(var(--pic-radius) - 6px);
}


/* ===== [27j] TAP_IN_SCENE — candidates must be VISIBLE ==================================
   .tis-hot was border:none;background:transparent, so every hotspot was invisible and only the
   CORRECT one pulsed after 6s. A child had nothing to aim at, and the SME decks ask for "a green
   glowing box on every candidate (correct + distractors)" — all of them, so the outline marks
   "tappable" and never leaks which one is right. Two games, 5 slides.
   .reveal-hold / .faded are the terminal-help pair already used by the pick path: at max_attempts
   the correct hotspot breathes and the others dim, and the child still taps it (rule 9). */
.tis-hot{box-shadow:0 0 0 4px rgba(0,177,50,.55), inset 0 0 0 3px rgba(255,255,255,.75);
         background:rgba(0,177,50,.06);}
.tis-hot:hover{box-shadow:0 0 0 6px rgba(0,177,50,.85), inset 0 0 0 3px rgba(255,255,255,.9);}
.tis-hot.faded{box-shadow:0 0 0 3px rgba(120,140,160,.30);background:transparent;opacity:.45;
               pointer-events:none;}
.tis-hot.reveal-hold{animation:revealPulse 1.1s ease-in-out infinite;
                     box-shadow:0 0 0 6px rgba(0,177,50,.95),0 0 30px rgba(0,177,50,.6);}
/* [h01 local] Yasir 2026-07-31: "on second attempt as well we have to get the red thingy" — the red
   flash on a wrong TAP_IN_SCENE tap showed unreliably, and never on the terminal attempt with a
   mouse. Root cause is THIS block: it landed later in the sheet than .tis-hot.wrong-flash (above),
   so at equal specificity its :hover rule wins while the pointer is still parked on the figure the
   child just tapped (desktop = always), and .faded wins the moment terminal help applies it — both
   silently override the red box-shadow. Re-stated here, after every competing rule, with !important
   so the red wins for the full 700ms the flash class is on, on EVERY registered wrong tap — first,
   second, terminal alike. app.js already delays .faded to 720ms so the sequence stays
   red-then-fade per RULING_wrong_answer_tap. */
.tis-hot.wrong-flash{
  box-shadow:0 0 0 6px var(--wrong),0 0 26px rgba(249,53,68,.55) !important;
  background:rgba(249,53,68,.10) !important;
}

/* ===== [28b] PHASE GATE — THE BACKGROUND MUST GO GRAY ===================================
   Yasir 2026-07-28 with a Figma reference: on a transition screen the background goes GRAYISH, not
   merely a touch darker. Three things were stopping that:
     1. the scrim was rgba(57,55,55,.35) — a 35% dim with NO desaturation, so a colourful KG scene
        stayed colourful behind it. The meeting ruling was "dark 60% blur";
     2. `body.is-start .phase-gate{background:transparent !important}` (was style.css:1084) meant the
        FIRST gate — landing -> tutorial — had NO scrim whatsoever. That was open as flag S2-a and this
        ruling closes it;
     3. grayscale has to ride on the BACKDROP filter, not on the gate's own background, or it would
        also desaturate the peeking Swiftie and the headline. backdrop-filter affects only what is
        BEHIND the element, so the mascot and title keep full colour exactly as in the Figma frame.
   Kept as one late block so it beats both the base rule and the is-start override. */
.phase-gate{
  background:rgba(57,55,55,.6);
  backdrop-filter:blur(15.8px);
  -webkit-backdrop-filter:blur(15.8px);
}
body.is-start .phase-gate{
  background:rgba(57,55,55,.6) !important;
  backdrop-filter:blur(15.8px) !important;
  -webkit-backdrop-filter:blur(15.8px) !important;
}

/* ===== [28d] STORY_SCENE PICTURE STAYS PERFECTLY STILL ===================================
   Yasir 2026-07-28: the teaching picture "slowly zooms in and out on its own. It must stay
   completely still." That is `animation:storyKenBurns 20s infinite alternate` on .story-img
   (style.css:665) — a cinematic drift that is wrong here for two reasons: a KG child reading a
   teaching picture should not have it moving under them, and combined with object-fit it made the
   framing creep. Killed engine-wide, not just in .stage.tut: it is never wanted.
   The keyframes stay defined but unused, so nothing else that references them breaks. */
.story-img{animation:none !important;transform:none !important;}

/* ===== [28e] A DISABLED OPTION IS NEVER RED ==============================================
   Yasir 2026-07-28, calling it a constantly repeated issue: a wrong option locked on the 2nd tap kept
   a RED border + red glow, while the options disabled at the SAME moment by terminal help went plain
   grey (.faded). Two different looks for one meaning — "you can no longer tap this".
   Ruling: "when we disable a button NO red border — plain untappable, exactly like the untouched
   card." So .crossed now matches .faded once it is a LOCK.
   The 1st-wrong feedback is unaffected: the buzz + shake still fire, and 28d unblocks that card after
   700ms so it never reads as disabled. Red is now reserved for the momentary shake, never for a
   resting disabled state. This supersedes the red ring 27a introduced. */
.opt-cell.crossed{
  border-color:#EEF3FA !important;
  background:#fff !important;
  box-shadow:0 0 0 3px rgba(120,140,160,.22) !important;
  opacity:.45 !important;
}
.sentence-word.crossed{
  border-color:#EEF3FA !important;
  background:#fff !important;
  box-shadow:none !important;
  opacity:.45 !important;
}
.tap-all-item.nope{
  border-color:#EEF3FA !important;
  background:#fff !important;
  box-shadow:none !important;
  opacity:.45 !important;
}

/* ===== [28e] MY OWN REGRESSION FROM 28a — SEQUENCE_COMPLETE tray under the आगे pill =======
   28a gave SEQUENCE_COMPLETE an opt-in picture stimulus (which cleared a blocking request), but the
   extra element pushed .seq-tray down until the bottom ~30% of two tiles sat behind button.nav-btn —

.seq-stage{gap:20px;justify-content:flex-start;padding-top:8px;padding-bottom:96px;}

/* ===================== [28i] LANDING IMAGE HERO — SIZE IT AT ALL =====================
   `landing_hero {kind:'image'}` rendered at NATURAL size: measured 1244x695 inside a 1069x438 start
   card, which shoved the landing title to top:-106px, i.e. off screen. The only sizing rule was
   `.sg-hero img{height:118px}` (line 659) and it has NEVER matched anything — the hero element's
   class is `.sg-art`, not `.sg-hero`. That is the exact selector mismatch the 16e note recorded and
   fixed for the COUNT hero (.sg-hand), retargeted then only for hands and not for the plain image.
   So 118px is not prior behaviour being changed, it is dead code being replaced.
   Bounded by BOTH axes and by the card itself, so a tall portrait hero cannot push the title out
   either. `.sg-art .sg-hand` (0,2,0) still outranks `.sg-art img` (0,1,1), so count-hand landings

.sg-art img{max-height:180px;max-width:92%;width:auto;height:auto;object-fit:contain;}


/* ======== [28o] IN MATCHING / DRAGGING, EVERY CARD IS THE SAME SIZE ========
   Yasir 2026-07-28: "all the cards, both question and answer cards are to be of the same size in
   matching/dragging." They were three different sizes: .dd-zone 150x150, .dd-tile 104x104,
   .dd-tile.pic-tile 134x134 — so the thing you drag was visibly smaller than the thing you drop onto,
   and a picture tile was a third size again. Unified on 150, the largest of the three, so nothing
   shrinks and the drag target only gets easier for a KG thumb.
   NOT touched, on purpose:
     · .dd-tile.snapped — the 62px badge that parks INSIDE a filled zone. It is not a card.
     · .dd-stage.seq-words — word tiles size to their text, so equal squares are impossible there;
       forcing 150 would clip long words. Sentence-building is not the matching mechanic he means. */

.dd-stage:not(.seq-words) .dd-tile:not(.snapped){font-size:78px;}
