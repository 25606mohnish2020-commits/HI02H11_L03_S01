 <path d="M1224 432Q1222 470 1180 472" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".55"/>
 <g fill="url(#rivet)" stroke="#A9490F" stroke-width="2.5">
  <circle cx="500" cy="237" r="6"/><circle cx="614" cy="237" r="6"/><circle cx="728" cy="237" r="6"/><circle cx="842" cy="237" r="6"/><circle cx="956" cy="237" r="6"/><circle cx="1070" cy="237" r="6"/><circle cx="1184" cy="237" r="6"/>
  <circle cx="500" cy="495" r="6"/><circle cx="614" cy="495" r="6"/><circle cx="728" cy="495" r="6"/><circle cx="842" cy="495" r="6"/><circle cx="956" cy="495" r="6"/><circle cx="1070" cy="495" r="6"/><circle cx="1184" cy="495" r="6"/>
  <circle cx="429" cy="334" r="6"/><circle cx="429" cy="398" r="6"/><circle cx="1251" cy="334" r="6"/><circle cx="1251" cy="398" r="6"/>
